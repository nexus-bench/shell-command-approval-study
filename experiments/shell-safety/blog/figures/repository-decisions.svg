  <g id="text_35">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #172b41" transform="translate(7.2 466.915078)">36 synthetic v2 test cases. Ask means inspect or clarify before automatic approval; it does not mean proven harm.</text>
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #172b41" transform="translate(7.2 477.717539)">LANCET, Kestrel, secguard: command only. ModernBERT: command + working directory. Native policies differ.</text>
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #172b41" transform="translate(7.2 488.52)">*secguard artifact/runtime needs investigation. Stricter threshold selected on development cases.</text>
  </g>
